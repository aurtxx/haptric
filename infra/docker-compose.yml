name: open-exam-platform

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam_platform}
      POSTGRES_USER: ${POSTGRES_USER:-exam_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in infra/.env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgresql://${POSTGRES_USER:-exam_platform}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-exam_platform}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-lan}
      INSTALLATION_ID: ${INSTALLATION_ID:-local-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
      HAPTRIC_NODE_ID: ${HAPTRIC_NODE_ID:-compose-lan-node}
      HAPTRIC_NODE_ROLE: ${HAPTRIC_NODE_ROLE:-lan}
      HAPTRIC_SYNC_URL: ${HAPTRIC_SYNC_URL:-}
      HAPTRIC_SYNC_TOKEN: ${HAPTRIC_SYNC_TOKEN:-}
      HAPTRIC_SYNC_ORGANIZATION_ID: ${HAPTRIC_SYNC_ORGANIZATION_ID:-}
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-lan}
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
